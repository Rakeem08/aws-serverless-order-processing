name: Validate serverless platform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint Python code
        run: python -m ruff check src tests

      - name: Run tests
        run: python -m pytest -q

  terraform:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Check bootstrap formatting
        run: terraform -chdir=infra/bootstrap fmt -check -recursive

      - name: Check platform formatting
        run: terraform -chdir=infra/platform fmt -check -recursive

      - name: Initialize bootstrap for validation
        run: terraform -chdir=infra/bootstrap init -backend=false

      - name: Validate bootstrap
        run: terraform -chdir=infra/bootstrap validate

      - name: Initialize platform for validation
        run: terraform -chdir=infra/platform init -backend=false

      - name: Validate platform
        run: terraform -chdir=infra/platform validate