<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc"><title id="title">AWS Serverless Order Platform Architecture</title><desc id="desc">Authenticated API requests use separate create and get Lambda functions. Orders are queued in SQS, processed by Lambda, stored in DynamoDB with S3 receipts and EventBridge events. Failed messages go to a dead-letter queue. CloudWatch and SNS support operations.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#5b75a0"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#dc4558"/></marker></defs>
<rect x="0" y="0" width="1800" height="1220" rx="0" fill="#f5f8fc" stroke="#f5f8fc"/>
<text x="60" y="65" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#2563eb" font-weight="700">RAKEEM BREWINGTON  /  CLOUD ENGINEERING PORTFOLIO</text>
<text x="60" y="123" font-family="DejaVu Sans, sans-serif" font-size="42" fill="#102139" font-weight="700">AWS Serverless Order Platform</text>
<text x="60" y="164" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#52647c" font-weight="400">Authenticate customers. Queue orders. Process reliably. Make failures visible.</text>
