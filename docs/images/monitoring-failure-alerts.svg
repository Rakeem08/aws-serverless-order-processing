<text x="160" y="333" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#12223b" font-weight="700">API Gateway + Lambda</text>
<text x="102" y="373" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#52647c" font-weight="400">API access logs and request status</text>
