<circle cx="120" cy="517" r="27" fill="#2563eb" opacity=".10"/><g transform="translate(120,517)" fill="none" stroke="#2563eb" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="-21" y="-16" width="42" height="29" rx="4"/><path d="M-13 4l7-10 7 7 11-10M0 13v8M-10 21h20"/></g>
<text x="160" y="523" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#12223b" font-weight="700">Application + AWS metrics</text>
