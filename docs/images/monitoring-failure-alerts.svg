<text x="650" y="248" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#3f5675" font-weight="700">02  OBSERVE &amp; DETECT</text>
<text x="1250" y="248" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#3f5675" font-weight="700">03  NOTIFY &amp; INVESTIGATE</text>
