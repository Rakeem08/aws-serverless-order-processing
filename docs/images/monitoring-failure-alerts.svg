<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc"><title id="title">Serverless Monitoring and Failure Alerts</title><desc id="desc">API and Lambda logs go to CloudWatch Logs. Order, queue and Lambda metrics populate the dashboard. DLQ count, queue age and processor invocation errors trigger CloudWatch alarms and an encrypted SNS topic sends email to an operator. Partial batch failures require logs and queue monitoring.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#5b75a0"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#dc4558"/></marker></defs>
<rect x="0" y="0" width="1800" height="1220" rx="0" fill="#f5f8fc" stroke="#f5f8fc"/>
<text x="60" y="65" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#2563eb" font-weight="700">RAKEEM BREWINGTON  /  CLOUD ENGINEERING PORTFOLIO</text>
<text x="60" y="123" font-family="DejaVu Sans, sans-serif" font-size="42" fill="#102139" font-weight="700">Monitoring &amp; Failure Alerts</text>
<text x="60" y="164" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#52647c" font-weight="400">Collect evidence. Detect unhealthy orders. Notify an operator. Investigate before recovery.</text>
