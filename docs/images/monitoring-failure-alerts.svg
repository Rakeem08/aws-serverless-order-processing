<circle cx="690" cy="327" r="27" fill="#2563eb" opacity=".10"/><g transform="translate(690,327)" fill="none" stroke="#2563eb" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M-15-20h23l8 8v32h-31Z M8-20v9h8 M-8-3h16 M-8 5h16 M-8 13h10"/></g>
<text x="730" y="333" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#12223b" font-weight="700">CloudWatch Logs</text>
<text x="672" y="373" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#52647c" font-weight="400">Inspect request and message evidence</text>
<text x="672" y="400" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#52647c" font-weight="400">Use logs to investigate failed records</text>
